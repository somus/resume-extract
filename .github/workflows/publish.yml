name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run typecheck

      - run: bun run check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-binaries:
    needs: publish
    name: Release binary (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
            asset_name: resume-extract-linux-x64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            asset_name: resume-extract-linux-arm64
          - name: darwin-arm64
            runner: macos-14
            asset_name: resume-extract-darwin-arm64
          - name: windows-x64
            runner: windows-latest
            asset_name: resume-extract-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run typecheck

      - run: bun run check

      - name: Build release binary
        run: bun build --compile ./src/cli.ts --outfile ./dist/${{ matrix.asset_name }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/${{ matrix.asset_name }}
